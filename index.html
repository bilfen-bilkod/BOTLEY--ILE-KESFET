:root{--ink:#173d68;--blue:#2869dd;--cream:#fffaf0;--mint:#bceba8;--green:#63c443;--red:#f16768;--right:#4aa6ed;--yellow:#ffd45f;--shadow:0 7px 0 #143e8e24,0 18px 40px #113c7812;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{font-family:Nunito,'Trebuchet MS',sans-serif;font-weight:700;color:var(--ink);background:radial-gradient(ellipse at 78% 12%,#59a7ff70,transparent 50%),linear-gradient(135deg,#377eeb 0%,#2869dd 56%,#2055c5 100%);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .16s,box-shadow .16s,background .16s;flex-shrink:0}
button:focus-visible,a:focus-visible{outline:4px solid #ffe77a;outline-offset:4px}
button:active:not(:disabled){transform:translateY(3px)}
button:disabled{cursor:default;opacity:.48}
button svg{pointer-events:none;flex-shrink:0}
button:hover:not(:disabled){filter:brightness(1.025)}
[hidden]{display:none!important}
